merge_protections_settings:
  reporting_method: check-runs
  post_comment: true
  auto_merge_conditions:
    - body = VM3_MP_HEADRACE_RELEASE_260925_R2

merge_protections:
  - name: VM3 Merge Protections head freshness R2 260925
    if:
      - base = main
      - title = VM3 MP HEADRACE 260925 R2
    success_conditions:
      - check-success = vm3-mp-headrace-guard-r2

conflict_resolvers:
  - paths:
      - conflict.txt
    strategy: prefer-theirs
  - paths:
      - vm3-json-key-policy.json
    strategy: json

queue_rules:
  - name: vm3-cr-ff-stalebase-261005
    merge_method: fast-forward
    batch_size: 1
    queue_conditions:
      - base = vm3-cr-ff-base-261005
    merge_conditions:
      - check-success = vm3-cr-ff-guard
  - name: vm3-crjson-keyrename-261007
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 5 minutes
    queue_conditions:
      - base = vm3-crjson-keyrename-base-261007
      - title = VM3 CRJSON KEY RENAME 261007
    merge_conditions:
      - check-success = vm3-never-crjson-keyrename
