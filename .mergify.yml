pull_request_rules:
  - name: VM3 copy workflow context boundary 261006
    conditions:
      - base = main
      - title = VM3 COPYCTX EXTERNAL 261006
      - author = livastic-vm5-secondary-20260911
    actions:
      copy:
        branches:
          - vm3-copyctx-dest-261006
  - name: VM3 changes requested direct user R2 260922
    conditions:
      - title = VM3 TEAM CHANGES REQUESTED 260922
      - changes-requested-reviews-by = livastic-vm3-secondary-20260911
    actions:
      label:
        add:
          - vm3-changes-direct-user-r2-260922
  - name: VM3 changes requested team short R2 260922
    conditions:
      - title = VM3 TEAM CHANGES REQUESTED 260922
      - changes-requested-reviews-by = @vm3-author-team-260919
    actions:
      label:
        add:
          - vm3-changes-team-short-r2-260922
  - name: VM3 changes requested team full R2 260922
    conditions:
      - title = VM3 TEAM CHANGES REQUESTED 260922
      - changes-requested-reviews-by = @livastic-vm3-mergify-lab-0911/vm3-author-team-260919
    actions:
      label:
        add:
          - vm3-changes-team-full-r2-260922

merge_protections_settings:
  reporting_method: check-runs
  post_comment: true
  auto_merge_conditions:
    - body = VM3_MP_HEADRACE_RELEASE_260925_R2

merge_protections:
  - name: VM3 Merge Protections head freshness R2 260925
    if:
      - base = main
      - title = VM3 MP HEADRACE 260925 R2
    success_conditions:
      - check-success = vm3-mp-headrace-guard-r2

conflict_resolvers:
  - package-manager: npm
    directories:
      - /pkg
  - package-manager: uv
    directories:
      - /uvpkg
  - paths:
      - conflict.txt
    strategy: prefer-theirs
queue_rules:
  - name: vm3-midpolicyfresh-261009
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 1 sec
    branch_protection_injection_mode: queue
    queue_conditions:
      - base = vm3-midpolicyfresh-target-261009
      - title = VM3 MID POLICY FRESHNESS 261009
    merge_conditions:
      - check-success = vm3-midpolicyfresh-canary
      - check-success = vm3-midpolicyfresh-never

  - name: vm3-uvexclude-261009
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 30 sec
    queue_conditions:
      - base = vm3-uvexclude-base-261009
      - title = VM3 UV EXCLUDE NEWER 261009
    merge_conditions:
      - check-success = vm3-uvexclude-never-261009

merge_queue:
  mode: serial

