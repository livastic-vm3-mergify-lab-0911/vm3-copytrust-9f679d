pull_request_rules:
  - name: VM3 changes requested direct user R2 260922
    conditions:
      - title = VM3 TEAM CHANGES REQUESTED 260922
      - changes-requested-reviews-by = livastic-vm3-secondary-20260911
    actions:
      label:
        add:
          - vm3-changes-direct-user-r2-260922
  - name: VM3 changes requested team short R2 260922
    conditions:
      - title = VM3 TEAM CHANGES REQUESTED 260922
      - changes-requested-reviews-by = @vm3-author-team-260919
    actions:
      label:
        add:
          - vm3-changes-team-short-r2-260922
  - name: VM3 changes requested team full R2 260922
    conditions:
      - title = VM3 TEAM CHANGES REQUESTED 260922
      - changes-requested-reviews-by = @livastic-vm3-mergify-lab-0911/vm3-author-team-260919
    actions:
      label:
        add:
          - vm3-changes-team-full-r2-260922

  - name: Keep PRs up to date
    conditions:
      - -draft
      - "#commits-behind >= 1"
    actions:
      update:
  - name: VM3 KPU seed copy 260929
    conditions:
      - title = VM3 KPU SEED COPY 260929
    actions:
      copy:
        branches:
          - main
        title: "VM3 KPU COPY SEED {{ number }}"
        body: "Controlled VM3 copy seed."

merge_queue:
  mode: isolated
  max_parallel_checks: 2

scopes:
  source:
    files:
      ordinary:
        include:
          - ordinary/**/*
  barrier_files:
    include:
      - .mergify.yml

queue_rules:
  - name: vm3-configbar-impact-260929
    batch_size: 1
    queue_conditions:
      - base = main
    merge_conditions:
      - check-success = vm3-configbar-release-260929
      - label = vm3-security-approved-260929
    merge_method: merge
