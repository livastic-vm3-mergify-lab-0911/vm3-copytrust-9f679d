scopes:
  source:
    files:
      critical-scope:
        include:
          - critical/**
      safe-scope:
        include:
          - safe/**
pull_request_rules:
  - name: vm3 rename old path must retain critical scope
    conditions:
      - title = VM3 FILE PATTERN RENAME BOTH PATHS 260918
      - scope = critical-scope
      - -label = vm3-rename-old-scope-260918
    actions:
      label:
        add:
          - vm3-rename-old-scope-260918
  - name: vm3 rename new path must add safe scope
    conditions:
      - title = VM3 FILE PATTERN RENAME BOTH PATHS 260918
      - scope = safe-scope
      - -label = vm3-rename-new-scope-260918
    actions:
      label:
        add:
          - vm3-rename-new-scope-260918
