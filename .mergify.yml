commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm3-secondary-20260911
scopes:
  source:
    files:
      frontend:
        include:
          - frontend/**
      docs:
        include:
          - docs/**
      config:
        include:
          - .mergify.yml
          - .github/workflows/**
queue_rules:
  - name: vm3-direct-merge-provenance
    queue_conditions:
      - base ~= ^vm3-direct-(control|treatment)-target-20260918$
    merge_conditions:
      - check-success = vm3-direct-merge-guard
    merge_method: merge
    batch_size: 1
merge_queue:
  mode: serial
  max_parallel_checks: 1
  status_comments: all
