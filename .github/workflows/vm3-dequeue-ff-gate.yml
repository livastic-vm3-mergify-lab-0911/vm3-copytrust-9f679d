name: VM3 Dequeue Fast Forward Gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  gate:
    name: vm3-dequeue-ff-gate
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    steps:
      - name: Hold queue finalizer for explicit dequeue
        run: sleep 60
