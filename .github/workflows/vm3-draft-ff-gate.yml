name: VM3 Draft Fast Forward Gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  gate:
    name: vm3-draft-ff-gate
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    steps:
      - name: Hold queue finalizer for draft transition
        run: sleep 75
