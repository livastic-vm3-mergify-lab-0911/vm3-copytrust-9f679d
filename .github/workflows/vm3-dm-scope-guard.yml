name: VM3 Direct Merge Scope Guard
on:
  push:
    branches:
      - '**'
jobs:
  guard:
    name: vm3-dm-scope-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject the combined seed+candidate tree
        shell: bash
        run: |
          if [[ -f scope-a/seed.flag && -f scope-a/candidate.flag ]]; then
            echo 'VM3_DM_SCOPE_POISON_COMBINED_TREE_FAIL'
            exit 1
          fi
          echo 'VM3_DM_SCOPE_POISON_STANDALONE_PASS'
