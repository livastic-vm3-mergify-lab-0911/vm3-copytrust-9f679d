name: VM3 Isolated Barrier Security
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  guard:
    name: vm3-isobar-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enforce barrier-dependent payload policy
        shell: bash
        run: |
          set -euo pipefail
          mode=legacy
          if [ -f barrier/security-mode.txt ]; then
            mode="$(tr -d '\r\n' < barrier/security-mode.txt)"
          fi
          echo "VM3 mode=$mode"
          if [ "$mode" = "enforce" ] && [ -f ordinary/attack.txt ]; then
            echo 'VM3_ISOBAR_SECURITY_BLOCK: enforce mode rejects ordinary/attack.txt'
            exit 1
          fi
          if [ "$mode" = "legacy" ] && [ -f ordinary/attack.txt ]; then
            echo 'VM3_ISOBAR_DELAY_OLD_EXTERNAL_BATCH'
            sleep 45
          fi
          echo "VM3_ISOBAR_SECURITY_PASS mode=$mode"
