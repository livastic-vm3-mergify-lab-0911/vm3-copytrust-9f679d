name: VM3 Base Freshness Gate
on:
  push:
    branches:
      - '**'
jobs:
  gate:
    name: vm3-basefresh-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject stale-tested combined tree
        shell: bash
        run: |
          sleep 45
          if [[ -f vm3-basefresh-risk.flag && -f vm3-basefresh-candidate.flag ]]; then
            echo 'VM3_BASEFRESH_COMBINED_TREE_FAIL'
            exit 1
          fi
          echo 'VM3_BASEFRESH_SINGLE_SIDE_PASS'
