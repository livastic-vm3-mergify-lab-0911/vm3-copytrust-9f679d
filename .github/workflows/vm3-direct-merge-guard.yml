name: VM3 Direct Merge Provenance Guard
on:
  push:
    branches:
      - '**'
jobs:
  guard:
    name: vm3-direct-merge-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail only on unrecorded-base treatment combination
        shell: bash
        run: |
          if [[ -f frontend/treatment.txt && -f docs/unrecorded-risk.txt ]]; then
            echo 'combined treatment tree reached queue CI; fail closed sentinel'
            exit 1
          fi
          echo 'standalone or control tree is safe'
