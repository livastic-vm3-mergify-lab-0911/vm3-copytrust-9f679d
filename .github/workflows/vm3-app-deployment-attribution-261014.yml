name: VM3 Controlled App Deployment Attribution 261014
on:
  push:
    branches:
      - vm3-provenance-status-lab-261014
permissions:
  contents: read
  deployments: write
jobs:
  app_provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Create synthetic GitHub App deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const response = await github.rest.repos.createDeployment({
              owner, repo, ref: context.sha,
              environment: "vm3-app-token-status-261014",
              description: "VM3 controlled provenance failure baseline; no real deployment",
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
            });
            await github.rest.repos.createDeploymentStatus({
              owner, repo, deployment_id: response.data.id,
              state: "failure",
              description: "VM3 inert app-authored failure status",
              auto_inactive: false,
            });
            core.info("VM3_APP_DEPLOYMENT_TEST_COMPLETE");
