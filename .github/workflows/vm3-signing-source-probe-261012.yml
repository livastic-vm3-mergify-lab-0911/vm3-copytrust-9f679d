name: VM3 Fork Mixed Signed 251 261012
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-controlled-signed-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Build 250 verified commits after single unsigned B-owned base
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GH_REPO" == "livastic-vm5-secondary-20260911/vm3-copytrust-9f679d" ]]
          branch='vm3-commit250-mixed-gha-261012'
          tree='ec321576a9a52eb308895c92c52bf61687ba9533'
          parent='5808e07a8c6d2b1f62c982fb7d12b7745e6088e9'
          initial=$(gh api "repos/$GH_REPO/git/commits/$parent" --jq '.verification.verified')
          [[ "$initial" == 'false' ]] || { echo 'Unexpected signed first commit; abort'; exit 1; }
          if gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq .object.sha >/dev/null 2>&1; then
            echo 'Target fork branch already exists, refusing overwrite'; exit 1
          fi
          for i in $(seq 2 251); do
            num=$(printf '%03d' "$i")
            made=$(gh api -X POST "repos/$GH_REPO/git/commits" \
              -f message="VM3 independently verified fork contribution $num/251" \
              -f tree="$tree" -f "parents[]=$parent" \
              --jq '{sha:.sha,verified:.verification.verified,reason:.verification.reason}')
            current=$(jq -r '.sha' <<< "$made")
            ok=$(jq -r '.verified' <<< "$made")
            if [[ "$ok" != 'true' ]]; then
              sleep 1
              ok=$(gh api "repos/$GH_REPO/git/commits/$current" --jq '.verification.verified')
            fi
            [[ "$ok" == 'true' ]] || { echo "GitHub did not verify commit $num"; exit 1; }
            parent="$current"
            if (( i % 25 == 0 )); then echo "VERIFIED_COUNT=$((i-1)) LAST_SHA=$parent"; fi
            sleep 0.8
          done
          gh api -X POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/heads/$branch" -f sha="$parent" \
            --jq '{ref:.ref,sha:.object.sha}'
          echo 'ONE_UNSIGNED_250_GITHUB_VERIFIED_SOURCE_READY'
