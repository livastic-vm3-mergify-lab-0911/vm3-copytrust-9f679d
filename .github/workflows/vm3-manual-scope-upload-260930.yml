name: VM3 manual scope upload 260930
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to mark security-critical
        required: true
        type: string
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: Mergifyio/setup-cli@dc99f07e699b94b39e5495c24596372813eadcbc
        with:
          mergify_cli_version: 2026.7.21.1
      - name: Upload controlled security-critical scope
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_CI_SCOPE_VM3_260930 }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          mergify ci scopes-send \
            --repository livastic-vm3-mergify-lab-0911/vm3-copytrust-9f679d \
            --pull-request "$PR_NUMBER" \
            --scope security-critical
