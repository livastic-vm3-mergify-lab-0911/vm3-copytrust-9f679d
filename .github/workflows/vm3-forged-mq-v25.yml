name: VM3 Forged MQ Scope v25
on:
  pull_request:

jobs:
  detect-scopes:
    runs-on: ubuntu-latest
    outputs:
      critical: ${{ fromJSON(steps.scopes.outputs.scopes).critical }}
      detected-base: ${{ steps.scopes.outputs.base }}
      detected-head: ${{ steps.scopes.outputs.head }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect scopes with released first-party action
        id: scopes
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes

  critical-tests:
    needs: detect-scopes
    if: ${{ needs.detect-scopes.outputs.critical == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'VM3_V25_CRITICAL_TEST_RAN_AND_FAILED'
          exit 1

  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - detect-scopes
      - critical-tests
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate exactly as documented
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
