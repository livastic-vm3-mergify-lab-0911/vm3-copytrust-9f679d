name: VM3 MP headrace guard R2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  vm3-mp-headrace-guard-r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Gate current PR revision
        shell: bash
        run: |
          echo "VM3_KZZ3_B_ONLY_WORKFLOW_OVERRIDE_SUCCESS"
          exit 0
