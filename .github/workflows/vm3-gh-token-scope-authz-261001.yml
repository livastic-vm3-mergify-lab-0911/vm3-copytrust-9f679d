name: VM3 external fork GitHub token scope authz 261001
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.pull_request.title == 'VM3 GH TOKEN SCOPE AUTHZ 261001' && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      - name: Install audited CLI commit with commit-scoped scopes support
        run: |
          cargo install --git https://github.com/Mergifyio/mergify-cli \
            --rev 1ef19c974e958d0313d5fd31e082ee229328083a \
            --locked mergify-cli
      - name: Attempt manual scope upload with only GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mergify ci scopes-send \
            --repository livastic-vm3-mergify-lab-0911/vm3-copytrust-9f679d \
            --pull-request "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --scope vm3-gh-token-probe-261001
