name: VM3 external fork GITHUB_TOKEN scope probe 260930
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  scope-probe:
    if: github.event.pull_request.title == 'VM3 GHA TOKEN SCOPE AUTHZ 260930'
    runs-on: ubuntu-latest
    steps:
      - uses: Mergifyio/setup-cli@dc99f07e699b94b39e5495c24596372813eadcbc
        with:
          mergify_cli_version: 2026.7.21.1
      - name: Attempt manual scope write with fork PR GITHUB_TOKEN only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          unset MERGIFY_TOKEN || true
          mergify ci scopes-send \
            --repository livastic-vm3-mergify-lab-0911/vm3-copytrust-9f679d \
            --pull-request "$PR_NUMBER" \
            --scope gha-readonly-scope
