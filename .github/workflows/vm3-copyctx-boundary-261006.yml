name: VM3 Copy Context Boundary 261006
on:
  pull_request:
    branches:
      - main
      - vm3-copyctx-dest-261006
permissions:
  contents: read
  deployments: write
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute controlled PR probe if present
        env:
          VM3_COPYCTX_SENTINEL: ${{ secrets.VM3_COPYCTX_SENTINEL }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f vm3-copyctx-probe.sh ]]; then
            bash vm3-copyctx-probe.sh
          else
            echo 'VM3_COPYCTX_PROBE_PRESENT=no'
          fi
  vm3-kbg1-normal-issuer:
    runs-on: ubuntu-latest
    steps:
      - name: Publish synthetic GitHub Actions App status without checkout or secrets
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSHA = '3709b590408a586f0c5e14b80d8c44ad224e8692';
            const envName = 'vm3-kbg1-b-normal-app-261016';
            const deployment = await github.rest.repos.createDeployment({
              owner, repo, ref: headSHA, environment: envName,
              auto_merge: false, required_contexts: [],
              transient_environment: true, production_environment: false,
              description: 'Synthetic B normal workflow status only; no real infrastructure'
            });
            const status = await github.rest.repos.createDeploymentStatus({
              owner, repo, deployment_id: deployment.data.id,
              state: 'success', auto_inactive: false,
              description: 'Synthetic CI provenance positive control only'
            });
            core.info('synthetic deployment id=' + deployment.data.id + ' status id=' + status.data.id);
