name: VM3 Merge Batch Gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  gate:
    name: vm3-merge-batch-gate
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    steps:
      - name: Controlled merge-batch validation
        run: sleep 45
